<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="verif.meta.titulo">Confirmação de e-mail | NoHeroes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css">
  <link rel="stylesheet" href="assets/css/paginas.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/i18n/comum.js"></script>
  <script src="assets/i18n/conta.js"></script>
  <script src="assets/js/config.js"></script>
  <script defer src="assets/js/noheroes-ui.js"></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth">
  <div id="loading" class="nh-auth-card" role="status">
    <p data-i18n="verif.verificando">Confirmando seu e-mail…</p>
  </div>
  <div id="success" class="nh-auth-card" hidden>
    <h1 class="nh-h2" data-i18n="verif.ok_titulo">E-mail confirmado</h1>
    <p data-i18n="verif.ok">Sua conta está ativa. Agora é só entrar.</p>
    <a href="login.html" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="login.entrar">Entrar</a>
  </div>
  <div id="error" class="nh-auth-card" hidden>
    <h1 class="nh-h2" data-i18n="verif.erro_titulo">Não foi possível confirmar</h1>
    <p data-i18n="verif.erro">O link é inválido ou expirou. Peça um novo e-mail de confirmação.</p>
    <a href="reenvio.html" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="reenv.enviar">Reenviar e-mail</a>
  </div>
</main>

<nh-footer></nh-footer>

<script>
(async function () {
  'use strict';
  const token = new URLSearchParams(location.search).get('token');
  const mostrar = (id) => {
    document.getElementById('loading').hidden = true;
    document.getElementById(id).hidden = false;
  };
  if (!token) return mostrar('error');
  try {
    const res = await fetch(`${API_BASE}/api/auth/verify-email?token=${encodeURIComponent(token)}`);
    const data = await res.json().catch(() => ({}));
    mostrar(res.ok && data.success ? 'success' : 'error');
  } catch (_) {
    mostrar('error');
  }
})();
</script>
</body>
</html>
