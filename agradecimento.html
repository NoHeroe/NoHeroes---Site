<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="ag.meta.titulo">Obrigado | NoHeroes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css?v=f9b5a138da">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css?v=662aa10064">
  <link rel="stylesheet" href="assets/css/paginas.css?v=a013b35520">
  <link rel="stylesheet" href="assets/css/checkout.css?v=cbecf2af88">
  <script src="assets/js/i18n.js?v=a0a8450a3b"></script>
  <script src="assets/i18n/comum.js?v=9043f3b63e"></script>
  <script src="assets/i18n/pedidos.js?v=bcabc7de11"></script>
  <script src="assets/i18n/checkout.js?v=4823fa4885"></script>
  <script src="assets/js/config.js?v=2e78d624f2"></script>
  <script src="assets/js/carrinho.js?v=e14161b093"></script>
  <script src="assets/js/pedidos.js?v=3776bc9eb5"></script>
  <script defer src="assets/js/noheroes-ui.js?v=2c2a7db9fc"></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth" style="max-width:34rem;text-align:center">
  <div class="nh-auth-card" aria-live="polite">
    <h1 id="titulo" class="nh-h2" data-i18n="ag.processando">Processando…</h1>
    <p id="mensagem" class="nh-lead" style="margin:0 auto" data-i18n="ag.aguarde">Aguarde um momento.</p>
    <div id="statusSelo"></div>

    <div id="pixBox" hidden>
      <div id="pixQr" class="ck-pix-qr" role="img" aria-label="QR Code do Pix" data-i18n-attr="aria-label:ck.pix_qr"></div>
      <div id="pixCodigo" class="ck-codigo" style="margin-top:10px;text-align:left"></div>
      <button id="btnCopiarPix" class="nh-btn nh-btn-pri nh-btn-grande w-full" style="margin-top:10px" type="button" data-i18n="ck.copiar">Copiar código</button>
      <p class="text-xs text-white/60 mt-3" data-i18n="ag.pix_aviso">Seu pedido será confirmado após a verificação do pagamento.</p>
    </div>

    <div id="pedido" class="ag-pedido" hidden></div>

    <div class="grid gap-2" style="margin-top:6px">
      <a id="btnPedidos" href="/profile#compras" class="nh-btn nh-btn-pri nh-btn-grande w-full" hidden data-i18n="ag.ver_compras">Ver minhas compras</a>
      <a href="/store" class="nh-btn nh-btn-sec w-full" data-i18n="ag.voltar_loja">Voltar para a loja</a>
      <a id="btnApoiar" href="/apoiar" class="nh-btn nh-btn-sec w-full" hidden data-i18n="ag.voltar_apoiar">Voltar para apoiar</a>
    </div>
  </div>
</main>

<nh-footer></nh-footer>

<style>
  .ag-pedido { text-align: left; border-top: 1px solid var(--nh-linha); padding-top: 12px; font-size: 14px; }
  .ag-linha { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
</style>
<script>
(function () {
  'use strict';
  const t = (k, v) => NHI18n.t(k, v);
  const qs = (s) => document.querySelector(s);
  const P = window.NHPedido;
  const params = new URLSearchParams(location.search);
  const orderId = params.get('order') || params.get('external_reference') || '';
  const token = (localStorage.getItem('NoHeroes_token') || '').trim().replace(/^Bearer\s+/i, '');
  let ultimo = null, modo = null;

  function textos(tituloK, msgK) { qs('#titulo').textContent = t(tituloK); qs('#mensagem').textContent = t(msgK); }

  // Doação (/apoiar): mensagem pelo status que o Mercado Pago devolve na URL.
  function doacao() {
    modo = 'doacao';
    qs('#btnApoiar').hidden = false;
    const s = params.get('mp_status') || params.get('collection_status') || params.get('status') || 'success';
    if (s === 'success' || s === 'approved') textos('ag.doacao_ok_t', 'ag.doacao_ok');
    else if (s === 'pending' || s === 'in_process') textos('ag.doacao_pend_t', 'ag.doacao_pend');
    else textos('ag.doacao_erro_t', 'ag.doacao_erro');
  }

  function render(o) {
    ultimo = o; modo = 'pedido';
    const chave = 'ag.' + o.status;
    if (t(chave + '_t') !== chave + '_t') textos(chave + '_t', chave);
    else { qs('#titulo').textContent = t('ck.pedido') + ' ' + o.id; qs('#mensagem').textContent = ''; }
    qs('#statusSelo').innerHTML = P.seloPagamento(o.status) + (o.fulfillment_status !== 'na' ? ' ' + P.seloEntrega(o.fulfillment_status) : '');
    qs('#btnPedidos').hidden = false;
    qs('#pedido').hidden = false;
    qs('#pedido').innerHTML =
      `<div class="text-xs text-white/55 mb-2">${P.esc(t('ck.pedido'))} <span class="font-mono">${P.esc(o.id)}</span> · ${P.esc(P.metodo(o.payment_provider))}</div>` +
      o.items.map((i) => `<div class="ag-linha"><span>${i.quantity}× ${P.esc(i.title || 'Item #' + i.id)}${i.variant_label ? ' <span class="text-white/55">(' + P.esc(i.variant_label) + ')</span>' : ''}</span><span>${i.unit_price != null ? P.brl(i.unit_price * i.quantity) : ''}</span></div>`).join('') +
      (o.discount ? `<div class="ag-linha text-green-300"><span>${P.esc(t('ck.desconto'))}</span><span>−${P.brl(o.discount)}</span></div>` : '') +
      (o.shipping_method ? `<div class="ag-linha text-white/70"><span>${P.esc(t('ck.frete'))} · ${P.esc(o.shipping_method.service)}</span><span>${o.shipping_cost ? P.brl(o.shipping_cost) : P.esc(t('ck.gratis'))}</span></div>` : '') +
      `<div class="ag-linha font-semibold" style="color:#facc15"><span>${P.esc(t('ck.total'))}</span><span>${P.brl(o.total)}</span></div>`;
    // O carrinho virou pedido (a não ser que o pagamento tenha sido recusado ou cancelado).
    if (!['rejected', 'cancelled'].includes(o.status)) NHCart.limpar();
  }

  async function api(path) {
    const r = await fetch(API_BASE + path, { headers: { Authorization: 'Bearer ' + token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.message || 'Erro ' + r.status), { status: r.status });
    return j.data;
  }
  async function mostrarPix(id) {
    const d = await api('/orders/' + encodeURIComponent(id) + '/payment');
    if (!d || d.kind !== 'pix') return;
    qs('#pixQr').innerHTML = d.qr_svg; // SVG gerado pelo nosso servidor
    qs('#pixCodigo').textContent = d.payload;
    qs('#pixBox').hidden = false;
  }
  qs('#btnCopiarPix').addEventListener('click', async () => {
    const b = qs('#btnCopiarPix');
    try { await navigator.clipboard.writeText(qs('#pixCodigo').textContent); b.textContent = t('ck.copiado'); }
    catch (_) {
      const r = document.createRange(); r.selectNodeContents(qs('#pixCodigo'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = t('ck.selecionado');
    }
    setTimeout(() => { b.textContent = t('ck.copiar'); }, 2500);
  });

  async function pedido() {
    if (!token) {
      modo = 'sem_login';
      qs('#titulo').textContent = t('ag.recebido_t');
      qs('#mensagem').innerHTML = `${P.esc(t('ag.entre'))} <a href="/login?volta=${encodeURIComponent('/agradecimento?order=' + orderId)}" class="nh-link">${P.esc(t('login.entrar'))}</a>`;
      return;
    }
    let tentativas = 0;
    async function carregar() {
      try {
        const o = await api('/orders/' + encodeURIComponent(orderId));
        render(o);
        if (o.status === 'awaiting_manual_confirmation' && qs('#pixBox').hidden) await mostrarPix(o.id);
        if (o.status !== 'awaiting_manual_confirmation') qs('#pixBox').hidden = true;
        // O aviso do Mercado Pago pode chegar segundos depois da volta: consulta de novo por até ~2 min.
        if (o.status === 'pending' && ++tentativas < 24) setTimeout(carregar, 5000);
      } catch (e) {
        modo = 'erro';
        qs('#titulo').textContent = t('ag.nao_encontrado_t');
        qs('#mensagem').textContent = e.status === 401 ? t('err.sessao') : t('ag.nao_encontrado');
      }
    }
    await carregar();
  }

  document.addEventListener('nh:lang', () => {
    if (modo === 'pedido' && ultimo) render(ultimo);
    else if (modo === 'doacao') doacao();
  });
  NH_DICT.pt['login.entrar'] = 'Entrar'; NH_DICT.en['login.entrar'] = 'Sign in';
  if (!orderId || /^don_/.test(orderId)) doacao(); else pedido();
})();
</script>
</body>
</html>
