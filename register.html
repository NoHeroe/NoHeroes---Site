<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="reg.meta.titulo">Criar conta | NoHeroes</title>
  <meta name="description" content="Crie sua conta NoHeroes para comprar e-books, acompanhar pedidos e receber novidades." data-i18n-attr="content:reg.meta.descricao">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.noheroes.com.br/register">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css?v=5ac32d3050">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css?v=662aa10064">
  <link rel="stylesheet" href="assets/css/paginas.css?v=a013b35520">
  <script src="assets/js/i18n.js?v=a0a8450a3b"></script>
  <script src="assets/i18n/comum.js?v=9043f3b63e"></script>
  <script src="assets/i18n/conta.js?v=98b89f59f0"></script>
  <script src="assets/js/config.js?v=b288e9296c"></script>
  <script defer src="assets/js/noheroes-ui.js?v=4187397f12"></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth">
  <h1 class="nh-h2" data-i18n="reg.titulo">Criar conta</h1>
  <p class="nh-lead" data-i18n="reg.sub">Com a conta você compra e-books, acompanha pedidos e recebe novidades.</p>

  <form id="registerForm" class="nh-auth-card" novalidate>
    <div class="nh-campo">
      <label for="nome_completo" data-i18n="reg.nome">Nome completo</label>
      <input type="text" id="nome_completo" class="nh-input" autocomplete="name" required>
    </div>
    <div class="nh-campo">
      <label for="username" data-i18n="reg.usuario">Nome de usuário</label>
      <input type="text" id="username" class="nh-input" autocomplete="username" required minlength="3">
    </div>
    <div class="nh-campo">
      <label for="email" data-i18n="conta.email">E-mail</label>
      <input type="email" id="email" class="nh-input" autocomplete="email" required>
    </div>
    <div class="nh-campos-2">
      <div class="nh-campo">
        <label for="password" data-i18n="conta.senha">Senha</label>
        <input type="password" id="password" class="nh-input" autocomplete="new-password" required minlength="8">
      </div>
      <div class="nh-campo">
        <label for="confirmPassword" data-i18n="reg.confirmar">Confirmar senha</label>
        <input type="password" id="confirmPassword" class="nh-input" autocomplete="new-password" required minlength="8">
      </div>
    </div>
    <p class="nh-dica" data-i18n="reg.senha_dica">Mínimo de 8 caracteres.</p>
    <div class="nh-campo">
      <label for="birthdate" data-i18n="reg.nascimento">Data de nascimento</label>
      <input type="date" id="birthdate" class="nh-input" required>
      <p class="nh-dica" data-i18n="reg.nascimento_dica">Obrigatório: a conta é para maiores de 16 anos.</p>
    </div>
    <div class="nh-campo">
      <label for="phone" data-i18n="reg.telefone">Telefone (opcional)</label>
      <input type="tel" id="phone" class="nh-input" autocomplete="tel">
    </div>
    <label class="nh-check">
      <input id="terms" type="checkbox" required>
      <span><span data-i18n="reg.concordo">Concordo com os</span> <a href="/termos" target="_blank" class="nh-link" data-i18n="reg.termos">Termos de uso</a> <span data-i18n="reg.e_a">e a</span> <a href="/privacidade" target="_blank" class="nh-link" data-i18n="reg.privacidade">Política de privacidade</a>.</span>
    </label>
    <button id="submitBtn" type="submit" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="reg.criar">Criar conta</button>
    <p id="error" class="nh-form-msg" role="alert"></p>
  </form>

  <p class="nh-auth-rodape"><span data-i18n="reg.ja_tem">Já tem conta?</span> <a href="/login" class="nh-link" data-i18n="login.entrar">Entrar</a></p>
</main>

<nh-footer></nh-footer>

<script>
(function () {
  'use strict';
  const t = (k, v) => NHI18n.t(k, v);
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  const aviso = (texto, ok) => { msg.textContent = texto; msg.className = 'nh-form-msg ' + (ok ? 'ok' : 'erro'); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    aviso('', true);
    const v = (id) => document.getElementById(id).value.trim();
    const dados = {
      nome_completo: v('nome_completo'), username: v('username'), email: v('email'),
      password: document.getElementById('password').value, phone: v('phone'), birthdate: v('birthdate'),
      termsAccepted: document.getElementById('terms').checked, lang: NHI18n.lang,
    };
    if (!dados.nome_completo || !dados.username || !dados.email || !dados.password || !dados.birthdate) return aviso(t('reg.erro_obrigatorios'));
    if (dados.password.length < 8) return aviso(t('reg.erro_senha_curta'));
    if (dados.password !== document.getElementById('confirmPassword').value) return aviso(t('reg.erro_senhas'));
    const n = new Date(dados.birthdate), h = new Date();
    let idade = h.getFullYear() - n.getFullYear();
    if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) idade--;
    if (idade < 16) return aviso(t('err.AGE_RESTRICTED'));
    if (!dados.termsAccepted) return aviso(t('reg.erro_termos'));

    btn.disabled = true; btn.textContent = t('reg.criando');
    try {
      const res = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && (data.user || data.success)) {
        form.reset();
        form.querySelectorAll('input,button').forEach((el) => { el.disabled = true; });
        aviso(t('reg.ok'), true);
      } else {
        aviso(NHI18n.erro(data, 'reg.erro'));
      }
    } catch (_) {
      aviso(t('err.conexao'));
    } finally {
      if (!form.querySelector('input').disabled) { btn.disabled = false; }
      btn.textContent = t('reg.criar');
    }
  });
})();
</script>
</body>
</html>
