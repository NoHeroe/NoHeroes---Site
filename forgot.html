<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="esq.meta.titulo">Recuperar senha | NoHeroes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css">
  <link rel="stylesheet" href="assets/css/paginas.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/i18n/comum.js"></script>
  <script src="assets/i18n/conta.js"></script>
  <script src="assets/js/config.js"></script>
  <script defer src="assets/js/noheroes-ui.js"></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth">
  <!-- Modo A: pedir o link -->
  <div id="requestView">
    <h1 class="nh-h2" data-i18n="esq.titulo">Recuperar senha</h1>
    <p class="nh-lead" data-i18n="esq.sub">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviamos um link para criar uma nova senha.</p>
    <form id="requestForm" class="nh-auth-card" novalidate>
      <div class="nh-campo">
        <label for="email" data-i18n="conta.email">E-mail</label>
        <input type="email" id="email" class="nh-input" autocomplete="email" required>
      </div>
      <button id="reqBtn" type="submit" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="esq.enviar">Enviar link</button>
      <p id="reqMsg" class="nh-form-msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <!-- Modo B: nova senha (token na URL) -->
  <div id="resetView" hidden>
    <h1 class="nh-h2" data-i18n="esq.nova_titulo">Nova senha</h1>
    <p class="nh-lead" data-i18n="esq.nova_sub">Defina a nova senha da sua conta.</p>
    <form id="resetForm" class="nh-auth-card" novalidate>
      <div class="nh-campo">
        <label for="password" data-i18n="esq.nova">Nova senha</label>
        <input type="password" id="password" class="nh-input" autocomplete="new-password" required minlength="8">
      </div>
      <div class="nh-campo">
        <label for="confirmPassword" data-i18n="esq.confirmar">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" class="nh-input" autocomplete="new-password" required minlength="8">
      </div>
      <p class="nh-dica" data-i18n="reg.senha_dica">Mínimo de 8 caracteres.</p>
      <button id="resBtn" type="submit" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="esq.redefinir">Salvar nova senha</button>
      <p id="resMsg" class="nh-form-msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <p class="nh-auth-rodape"><span data-i18n="esq.lembrou">Lembrou a senha?</span> <a href="/login" class="nh-link" data-i18n="login.entrar">Entrar</a></p>
</main>

<nh-footer></nh-footer>

<script>
(function () {
  'use strict';
  const t = (k, v) => NHI18n.t(k, v);
  const token = new URLSearchParams(location.search).get('token');
  if (token) { document.getElementById('requestView').hidden = true; document.getElementById('resetView').hidden = false; }
  const aviso = (el, texto, ok) => { el.textContent = texto; el.className = 'nh-form-msg ' + (ok ? 'ok' : 'erro'); };

  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('reqMsg'), btn = document.getElementById('reqBtn');
    const email = document.getElementById('email').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return aviso(msg, t('conta.erro_email'));
    btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { aviso(msg, t('esq.enviado'), true); e.target.reset(); }
      else aviso(msg, NHI18n.erro(data));
    } catch (_) { aviso(msg, t('err.conexao')); }
    finally { btn.disabled = false; }
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('resMsg'), btn = document.getElementById('resBtn');
    const password = document.getElementById('password').value;
    if (password.length < 8) return aviso(msg, t('reg.erro_senha_curta'));
    if (password !== document.getElementById('confirmPassword').value) return aviso(msg, t('reg.erro_senhas'));
    btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success) {
        aviso(msg, t('esq.redefinida'), true);
        setTimeout(() => { location.href = '/login'; }, 2000);
      } else aviso(msg, NHI18n.erro(data, 'esq.link_invalido'));
    } catch (_) { aviso(msg, t('err.conexao')); }
    finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
