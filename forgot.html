<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recuperar senha — NoHeroes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --nh-bg:#0a0a0a; --nh-fg:#e5e5e5; --nh-muted:#bdbdbd;
    --grad:linear-gradient(135deg,#8f4fff 0%,#facc15 100%);
    --border:rgba(255,255,255,.1); --glass:rgba(255,255,255,.04);
    --radius:16px;
  }
  body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--nh-bg);color:var(--nh-fg);overflow-x:hidden}
  .cinzel{font-family:"Cinzel Decorative",serif}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(10px)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 1.1rem;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.05);transition:.25s;font-weight:600}
  .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.08)}
  .btn-primary{background:var(--grad);color:#000;border:none}
  .btn-primary:hover{filter:saturate(1.05);transform:translateY(-1px) scale(1.01)}
  .input{background:#0e0e0e;border:1px solid var(--border);border-radius:12px;padding:.8rem .9rem;color:var(--nh-fg);width:100%}
  .hint{font-size:.82rem;color:#bdbdbd}
  #brasasCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none}
</style>
</head>
<body>
<canvas id="brasasCanvas" aria-hidden="true"></canvas>

<header class="fixed top-0 left-0 right-0 h-[70px] bg-[#0a0a0a]/85 border-b border-[#222] backdrop-blur-md z-50 flex items-center justify-between px-6">
  <a href="index.html" class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-amber-400"></div>
    <span class="cinzel text-xl bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-amber-200">NoHeroes</span>
  </a>
  <a href="login.html" class="text-sm font-semibold px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10">Entrar</a>
</header>
<div class="h-[70px]"></div>

<main class="max-w-md mx-auto px-4 py-16 relative z-10">
  <section class="card p-6 sm:p-8">

    <!-- MODO A: solicitar link -->
    <div id="requestView">
      <h1 class="cinzel text-3xl grad-text text-center mb-2">Recuperar senha</h1>
      <p class="text-center hint mb-6">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para redefinir a senha.</p>
      <form id="requestForm" class="grid gap-4">
        <label class="grid gap-2">
          <span class="hint">E-mail</span>
          <input type="email" id="email" class="input" required autocomplete="email">
        </label>
        <button id="reqBtn" type="submit" class="btn btn-primary w-full mt-2">
          <span id="reqText">Enviar link</span>
          <svg id="reqSpin" class="animate-spin h-4 w-4 hidden" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path></svg>
        </button>
        <p id="reqMsg" class="text-sm hidden text-center"></p>
      </form>
    </div>

    <!-- MODO B: definir nova senha (com token na URL) -->
    <div id="resetView" class="hidden">
      <h1 class="cinzel text-3xl grad-text text-center mb-2">Nova senha</h1>
      <p class="text-center hint mb-6">Defina a nova senha da sua conta.</p>
      <form id="resetForm" class="grid gap-4">
        <label class="grid gap-2">
          <span class="hint">Nova senha</span>
          <input type="password" id="password" class="input" required minlength="6" autocomplete="new-password">
        </label>
        <label class="grid gap-2">
          <span class="hint">Confirmar nova senha</span>
          <input type="password" id="confirmPassword" class="input" required minlength="6" autocomplete="new-password">
        </label>
        <button id="resBtn" type="submit" class="btn btn-primary w-full mt-2">
          <span id="resText">Redefinir senha</span>
          <svg id="resSpin" class="animate-spin h-4 w-4 hidden" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path></svg>
        </button>
        <p id="resMsg" class="text-sm hidden text-center"></p>
      </form>
    </div>

    <p class="mt-6 text-center text-sm text-white/60">
      Lembrou a senha? <a href="login.html" class="text-white hover:underline">Entrar</a>
    </p>
  </section>
</main>

<footer style="padding:32px 20px;text-align:center;border-top:1px solid rgba(255,255,255,0.06);background:#000;">
  <div style="font-family:'Cinzel Decorative',serif;font-size:16px;background:linear-gradient(135deg,#c4a3ff,#f0d99a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;">NoHeroes</div>
  <p style="font-size:11px;color:rgba(255,255,255,0.2);margin:0;">© <span id="year"></span> NoHeroes. Todos os direitos reservados.</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const API_BASE = 'https://api.noheroes.com.br';

// === Brasas canvas (mesmo padrão das páginas de auth) ===
const canvas = document.getElementById("brasasCanvas");
const ctx = canvas.getContext("2d");
let particles = [], w, h;
function resizeCanvas() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
class Particle {
  constructor() { this.reset(true); }
  reset(initial = false) {
    this.x = Math.random() * w;
    this.y = initial ? Math.random() * h : h + Math.random() * 100;
    this.size = 1 + Math.random() * 2.5;
    this.speed = 0.2 + Math.random() * 0.5;
    this.alpha = 0.4 + Math.random() * 0.3;
    this.drift = (Math.random() - 0.5) * 0.5;
  }
  update() { this.y -= this.speed; this.x += this.drift; if (this.y < -10 || this.x < -50 || this.x > w + 50) this.reset(); }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(168, 85, 247, ${this.alpha})`;
    ctx.shadowColor = "#a855f7";
    ctx.shadowBlur = 12;
    ctx.fill();
  }
}
function createParticles(n) { for (let i = 0; i < n; i++) particles.push(new Particle()); }
function animate() { ctx.clearRect(0, 0, w, h); for (const p of particles) { p.update(); p.draw(); } requestAnimationFrame(animate); }
createParticles(150);
animate();

// === Lógica dual-mode ===
const params = new URLSearchParams(location.search);
const resetToken = params.get('token');

const requestView = document.getElementById('requestView');
const resetView = document.getElementById('resetView');

function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = "text-sm text-center " + (ok ? "text-green-400" : "text-red-400");
}

if (resetToken) {
  requestView.classList.add('hidden');
  resetView.classList.remove('hidden');
}

// --- Solicitar link ---
const requestForm = document.getElementById('requestForm');
const reqBtn = document.getElementById('reqBtn');
const reqText = document.getElementById('reqText');
const reqSpin = document.getElementById('reqSpin');
const reqMsg = document.getElementById('reqMsg');

requestForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  reqBtn.disabled = true; reqSpin.classList.remove('hidden'); reqText.textContent = 'Enviando...';
  reqMsg.classList.add('hidden');
  try {
    const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json().catch(() => ({}));
    showMsg(reqMsg, data.message || 'Se o e-mail estiver cadastrado, você receberá um link em instantes.', true);
    reqMsg.classList.remove('hidden');
    requestForm.reset();
  } catch (err) {
    showMsg(reqMsg, 'Falha de conexão com o servidor.', false);
    reqMsg.classList.remove('hidden');
  } finally {
    reqBtn.disabled = false; reqSpin.classList.add('hidden'); reqText.textContent = 'Enviar link';
  }
});

// --- Definir nova senha ---
const resetForm = document.getElementById('resetForm');
const resBtn = document.getElementById('resBtn');
const resText = document.getElementById('resText');
const resSpin = document.getElementById('resSpin');
const resMsg = document.getElementById('resMsg');

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  resMsg.classList.add('hidden');
  if (password.length < 6) { showMsg(resMsg, 'A senha deve ter ao menos 6 caracteres.', false); resMsg.classList.remove('hidden'); return; }
  if (password !== confirmPassword) { showMsg(resMsg, 'As senhas não coincidem.', false); resMsg.classList.remove('hidden'); return; }
  resBtn.disabled = true; resSpin.classList.remove('hidden'); resText.textContent = 'Redefinindo...';
  try {
    const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: resetToken, password })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      showMsg(resMsg, 'Senha redefinida! Redirecionando para o login...', true);
      resMsg.classList.remove('hidden');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } else {
      showMsg(resMsg, data.message || 'Link inválido ou expirado. Solicite um novo.', false);
      resMsg.classList.remove('hidden');
    }
  } catch (err) {
    showMsg(resMsg, 'Falha de conexão com o servidor.', false);
    resMsg.classList.remove('hidden');
  } finally {
    resBtn.disabled = false; resSpin.classList.add('hidden'); resText.textContent = 'Redefinir senha';
  }
});
</script>
</body>
</html>
