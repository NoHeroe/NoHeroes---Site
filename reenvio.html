<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="reenv.meta.titulo">Reenviar confirmação | NoHeroes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css">
  <link rel="stylesheet" href="assets/css/paginas.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/i18n/comum.js"></script>
  <script src="assets/i18n/conta.js"></script>
  <script src="assets/js/config.js"></script>
  <script defer src="assets/js/noheroes-ui.js"></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth">
  <h1 class="nh-h2" data-i18n="reenv.titulo">Reenviar confirmação</h1>
  <p class="nh-lead" data-i18n="reenv.sub">Digite o e-mail da sua conta para receber um novo link de confirmação.</p>
  <form id="resendForm" class="nh-auth-card" novalidate>
    <div class="nh-campo">
      <label for="email" data-i18n="conta.email">E-mail</label>
      <input type="email" id="email" class="nh-input" placeholder="voce@email.com" data-i18n-attr="placeholder:conta.email_ph" autocomplete="email" required>
    </div>
    <button id="submitBtn" type="submit" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="reenv.enviar">Reenviar e-mail</button>
    <p id="msg" class="nh-form-msg" role="status" aria-live="polite"></p>
  </form>
  <p class="nh-auth-rodape"><span data-i18n="reenv.ja_confirmou">Já confirmou seu e-mail?</span> <a href="login.html" class="nh-link" data-i18n="login.entrar">Entrar</a></p>
</main>

<nh-footer></nh-footer>

<script>
(function () {
  'use strict';
  const t = (k) => NHI18n.t(k);
  const msg = document.getElementById('msg'), btn = document.getElementById('submitBtn');
  const aviso = (texto, ok) => { msg.textContent = texto; msg.className = 'nh-form-msg ' + (ok ? 'ok' : 'erro'); };
  document.getElementById('resendForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return aviso(t('conta.erro_email'));
    btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/api/auth/resend-verification`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) aviso(t('reenv.ok'), true);
      else aviso(NHI18n.erro(data, 'reenv.erro'));
    } catch (_) { aviso(t('err.conexao')); }
    finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
