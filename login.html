<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="login.meta.titulo">Entrar | NoHeroes</title>
  <meta name="description" content="Entre na sua conta NoHeroes para acompanhar pedidos, e-books e notificações." data-i18n-attr="content:login.meta.descricao">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.noheroes.com.br/login">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css">
  <link rel="stylesheet" href="assets/css/paginas.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/i18n/comum.js"></script>
  <script src="assets/i18n/conta.js"></script>
  <script src="assets/js/config.js"></script>
  <script defer src="assets/js/noheroes-ui.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-auth">
  <h1 class="nh-h2" data-i18n="login.titulo">Entrar</h1>
  <p class="nh-lead" data-i18n="login.sub">Acompanhe seus pedidos, e-books e notificações.</p>

  <form id="loginForm" class="nh-auth-card" novalidate>
    <div class="nh-campo">
      <label for="email" data-i18n="conta.email">E-mail</label>
      <input type="email" id="email" class="nh-input" placeholder="voce@email.com" data-i18n-attr="placeholder:conta.email_ph" autocomplete="email" required>
    </div>
    <div class="nh-campo">
      <label for="password" data-i18n="conta.senha">Senha</label>
      <div class="nh-senha">
        <input type="password" id="password" class="nh-input" placeholder="Sua senha" data-i18n-attr="placeholder:conta.senha_ph" autocomplete="current-password" required minlength="6">
        <button type="button" id="togglePass" class="nh-senha-ver" aria-pressed="false" data-i18n="conta.mostrar">Mostrar</button>
      </div>
    </div>
    <div class="nh-auth-linha">
      <label class="nh-check"><input id="remember" type="checkbox"> <span data-i18n="login.lembrar">Lembrar meu e-mail</span></label>
      <a href="/forgot" class="nh-link" data-i18n="login.esqueci">Esqueci a senha</a>
    </div>
    <button id="submitBtn" type="submit" class="nh-btn nh-btn-pri nh-btn-grande w-full" data-i18n="login.entrar">Entrar</button>
    <p id="error" class="nh-form-msg erro" role="alert"></p>
    <div class="nh-ou"><span data-i18n="conta.ou">ou</span></div>
    <div id="googleLoginContainer" class="nh-google"></div>
  </form>

  <p class="nh-auth-rodape"><span data-i18n="login.sem_conta">Não tem conta?</span> <a href="/register" class="nh-link" data-i18n="login.criar">Criar conta</a></p>
</main>

<nh-footer></nh-footer>

<script src="assets/js/compliance.js"></script>
<script>
(function () {
  'use strict';
  const t = (k, v) => NHI18n.t(k, v);
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');
  const pass = document.getElementById('password');
  const togglePass = document.getElementById('togglePass');

  togglePass.addEventListener('click', () => {
    const mostrar = pass.type === 'password';
    pass.type = mostrar ? 'text' : 'password';
    togglePass.setAttribute('aria-pressed', String(mostrar));
    togglePass.textContent = t(mostrar ? 'conta.ocultar' : 'conta.mostrar');
  });

  function erro(html) { errorEl.innerHTML = html; }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function concluir(token, data) {
    localStorage.setItem('NoHeroes_token', 'Bearer ' + token);
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    localStorage.setItem('isAdmin', payload.is_admin ? 'true' : 'false');
    await window.enforceCompliance('Bearer ' + token, { termsOutdated: !!data.termsOutdated, needsBirthdate: !!data.needsBirthdate });
    const volta = new URLSearchParams(location.search).get('volta');
    // Só páginas do próprio site: "/pagina?query#aba" (ou o formato antigo "pagina.html?query"); nunca outra origem.
    const ok = volta && (/^\/[a-z0-9_\-]*(\?[^#]*)?(#[a-z0-9_\-]*)?$/i.test(volta) || /^[a-z0-9_\-]+\.html(\?[^#]*)?$/i.test(volta));
    location.href = ok ? volta : (payload.is_admin ? '/admin' : '/profile');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro('');
    const email = document.getElementById('email').value.trim();
    const password = pass.value;
    if (!email || !password) { erro(esc(t('login.preencha'))); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = t('login.entrando');
    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.token) {
        if (document.getElementById('remember').checked) localStorage.setItem('NoHeroes_email', email);
        else localStorage.removeItem('NoHeroes_email');
        await concluir(data.token, data);
        return;
      }
      if (data.code === 'EMAIL_NAO_VERIFICADO' || /Verifique seu e-mail/i.test(data.message || '')) {
        erro(`${esc(t('err.EMAIL_NAO_VERIFICADO'))} <a href="/reenvio" class="nh-link">${esc(t('login.reenviar'))}</a>`);
      } else {
        erro(esc(NHI18n.erro(data, 'login.invalido')));
      }
      pass.value = '';
    } catch (_) {
      erro(esc(t('err.conexao')));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = t('login.entrar');
    }
  });

  const lembrado = localStorage.getItem('NoHeroes_email');
  if (lembrado) { document.getElementById('email').value = lembrado; document.getElementById('remember').checked = true; }

  // Google Sign-In
  function onGoogle(resp) {
    if (!resp.credential) return;
    fetch(API_BASE + '/api/auth/google', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }),
    })
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) throw data;
        await concluir(data.token, data);
      })
      .catch((data) => erro(esc(NHI18n.erro(data, 'login.google_falhou'))));
  }
  function botaoGoogle() {
    const c = document.getElementById('googleLoginContainer');
    c.innerHTML = '';
    google.accounts.id.renderButton(c, {
      theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', logo_alignment: 'left',
      locale: NHI18n.lang === 'en' ? 'en' : 'pt-BR', width: Math.min(c.clientWidth || 320, 400),
    });
  }
  let tentativas = 0;
  const timer = setInterval(() => {
    tentativas++;
    if (window.google && google.accounts && google.accounts.id) {
      clearInterval(timer);
      google.accounts.id.initialize({
        client_id: '356288579641-hc457vliri7rif3h6vobbc4qmsr4blcm.apps.googleusercontent.com',
        callback: onGoogle, auto_select: false, cancel_on_tap_outside: true,
      });
      botaoGoogle();
      document.addEventListener('nh:lang', botaoGoogle);
    }
    if (tentativas > 40) clearInterval(timer);
  }, 150);
})();
</script>
</body>
</html>
