<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="bib.meta.titulo">Minha biblioteca | NoHeroes</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tw.css?v=5ac32d3050">
  <link rel="stylesheet" href="assets/css/noheroes-ui.css?v=662aa10064">
  <link rel="stylesheet" href="assets/css/paginas.css?v=a013b35520">
  <link rel="stylesheet" href="assets/css/perfil.css?v=9131590b58">
  <script>
    // Sem sessão → login (volta para cá depois).
    (function () {
      var raw = (localStorage.getItem('NoHeroes_token') || '').replace(/^Bearer\s+/i, '').trim();
      if (raw.split('.').length !== 3) { location.replace('/login?volta=/inventario'); }
    })();
  </script>
  <script src="assets/js/i18n.js?v=a0a8450a3b"></script>
  <script src="assets/i18n/comum.js?v=9043f3b63e"></script>
  <script src="assets/i18n/biblioteca.js?v=e676192a36"></script>
  <script src="assets/js/config.js?v=b288e9296c"></script>
  <script defer src="assets/js/noheroes-ui.js?v=4187397f12"></script>
  <style>
    .bib-lista { display: grid; gap: 12px; margin-top: 18px; }
    @media (min-width: 768px) { .bib-lista { grid-template-columns: 1fr 1fr; } }
    .bib-item { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; padding: 14px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.025); }
    .bib-capa { width: 76px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: #141018; border: 1px solid rgba(143,79,255,.25); }
    .bib-capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bib-nome { font-weight: 700; color: #fff; line-height: 1.3; }
    .bib-meta { font-size: 13px; color: var(--nh-texto-2); margin-top: 2px; }
    .bib-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .bib-acoes .nh-btn { min-height: 40px; padding: 0 16px; font-size: 14px; }
    .bib-msg { font-size: 13px; margin-top: 6px; color: #fca5a5; }
    .bib-skel { height: 140px; border-radius: 16px; background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03));
      background-size: 200% 100%; animation: bibSkel 1.2s infinite linear; }
    @keyframes bibSkel { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .bib-skel { animation: none; } }
  </style>
</head>
<body class="nh-pagina">
<nh-background></nh-background>
<nh-header></nh-header>

<main id="conteudo" class="nh-wrap pf-main">
  <div class="pf-painel">
    <h1 class="nh-h2" data-i18n="bib.titulo">Minha biblioteca</h1>
    <p class="pf-sub" style="margin-top:8px" data-i18n="bib.sub">Tudo o que você comprou. Os e-books ficam aqui para baixar sempre que precisar.</p>
    <div class="nh-ctas-linha" style="margin-top:0">
      <a href="/profile#compras" class="nh-link" data-i18n="bib.ver_compras">Ver minhas compras</a>
      <a href="/store" class="nh-link" data-i18n="bib.ir_loja">Ir para a loja</a>
    </div>

    <div id="bibLista" class="bib-lista" aria-live="polite">
      <div class="bib-skel"></div><div class="bib-skel"></div>
    </div>
  </div>
</main>

<nh-footer></nh-footer>

<script>
(function () {
  const t = (k, v) => NHI18n.t(k, v);
  const token = (localStorage.getItem('NoHeroes_token') || '').replace(/^Bearer\s+/i, '').trim();
  const lista = document.getElementById('bibLista');
  let itens = null, erroCarga = false;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nome = (i) => (NHI18n.lang === 'en' && i.name_en) || i.name || t('bib.item');
  const imagem = (u) => {
    if (!u) return '';
    u = window.NH_IMG(u, 320); // asset do site → WebP otimizado
    if (u.startsWith('assets/')) return u;
    if (/^https?:\/\//.test(u)) return u;
    if (u.startsWith('/uploads')) return API_BASE + u;
    if (u.startsWith('/')) return u;
    return 'https://' + u; // legado: "noheroes.com.br/assets/..."
  };

  async function api(path) {
    const r = await fetch(API_BASE + path, { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { localStorage.removeItem('NoHeroes_token'); location.href = '/login?volta=/inventario'; throw new Error(t('err.sessao')); }
    return r;
  }

  function desenhar() {
    if (erroCarga) {
      lista.innerHTML = `<div class="nh-vazio" style="grid-column:1/-1"><p style="margin-bottom:12px">${esc(t('bib.erro'))}</p>
        <button type="button" class="nh-btn nh-btn-sec" id="bibTentar">${esc(t('bib.tentar'))}</button></div>`;
      document.getElementById('bibTentar').onclick = carregar;
      return;
    }
    if (!itens) return;
    if (!itens.length) {
      lista.innerHTML = `<div class="nh-vazio" style="grid-column:1/-1"><p style="margin-bottom:12px">${esc(t('bib.vazio'))}</p>
        <a href="/store" class="nh-btn nh-btn-pri">${esc(t('bib.ir_loja'))}</a></div>`;
      return;
    }
    lista.innerHTML = itens.map((i, n) => {
      const img = imagem(i.imageUrl);
      const quando = i.acquiredAt ? t('bib.comprado_em', { data: NHI18n.data(i.acquiredAt, { dateStyle: 'medium' }) }) : '';
      const acao = i.permiteDownload
        ? `<button type="button" class="nh-btn nh-btn-pri" data-baixar="${n}">${esc(t('bib.baixar'))}</button>`
        : `<a href="/profile#compras" class="nh-btn nh-btn-sec">${esc(t('bib.acompanhar'))}</a>`;
      return `<article class="bib-item">
        <div class="bib-capa">${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>
        <div>
          <p class="bib-nome">${esc(nome(i))}</p>
          <p class="bib-meta">${esc(i.permiteDownload ? t('bib.digital') : t('bib.fisico'))}${quando ? ' · ' + esc(quando) : ''}</p>
          <div class="bib-acoes">${acao}</div>
          <p class="bib-msg" data-msg="${n}" hidden></p>
        </div>
      </article>`;
    }).join('');
  }

  lista.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-baixar]');
    if (!b) return;
    const i = itens[+b.dataset.baixar];
    const msg = lista.querySelector(`[data-msg="${b.dataset.baixar}"]`);
    msg.hidden = true;
    b.disabled = true; b.textContent = t('bib.baixando');
    try {
      const r = await api('/inventory/' + i.userItemId + '/download');
      if (!r.ok) throw new Error(NHI18n.erro(await r.json().catch(() => null), 'bib.erro_baixar'));
      const cd = r.headers.get('content-disposition') || '';
      const m = cd.match(/filename\*\s*=\s*UTF-8''([^;]+)/i) || cd.match(/filename\s*=\s*"([^"]+)"/i);
      const arquivo = m ? decodeURIComponent(m[1].replace(/"/g, '')) : (i.name || 'ebook').replace(/[\\/:*?"<>|]/g, '') + '.pdf';
      const url = URL.createObjectURL(await r.blob());
      const a = Object.assign(document.createElement('a'), { href: url, download: arquivo });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) {
      msg.textContent = err.message || t('bib.erro_baixar');
      msg.hidden = false;
    } finally {
      b.disabled = false; b.textContent = t('bib.baixar');
    }
  });

  async function carregar() {
    erroCarga = false; itens = null;
    lista.innerHTML = '<div class="bib-skel"></div><div class="bib-skel"></div>';
    try {
      const r = await api('/inventory');
      const j = await r.json().catch(() => null);
      if (!r.ok || !j) throw new Error();
      itens = (Array.isArray(j.items) ? j.items : []).filter((i) => i.isActive !== false);
    } catch (_) { erroCarga = true; }
    desenhar();
  }

  document.addEventListener('nh:lang', desenhar);
  carregar();
})();
</script>
</body>
</html>
